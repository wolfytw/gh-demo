# 範例 B：九宮格平行測試
# 每次 push 或 PR，同時在 3 種作業系統 × 3 個 Python 版本跑測試，共 9 個 job 平行執行
# 搭配 Settings → Branches → 分支保護規則「Require status checks」，測試沒過就不能合併

name: 九宮格平行測試

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安裝測試工具
        run: pip install pytest

      - name: 執行測試
        run: pytest -v
